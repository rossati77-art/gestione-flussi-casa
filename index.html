function parseImporto(raw) {
  if (typeof raw === 'number') return raw;
  if (raw === null || raw === undefined) return null;
  let s = String(raw).trim().replace(/[€\s]/g,'');
  if (!s) return null;
  const neg = /^-/.test(s) || /^\(.*\)$/.test(s);
  s = s.replace(/[()\-+]/g,'');
  if (!/\d/.test(s)) return null;
  if (s.includes(',') && s.includes('.')) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',', '.');
    else s = s.replace(/,/g,'');
  } else if (s.includes(',')) {
    s = s.replace(',', '.');
  }
  const n = parseFloat(s);
  if (Number.isNaN(n)) return null;
  return neg ? -Math.abs(n) : n;
}
function parseData(raw) {
  if (!raw) return null;
  const s = String(raw).trim();
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function isExcelSerialDate(v) {
  const n = Number(v);
  return Number.isFinite(n) && n > 20000 && n < 60000;
}
function excelSerialToISO(serial) {
  const n = Number(serial);
  if (!Number.isFinite(n)) return null;
  const ms = Math.round((n - 25569) * 86400 * 1000);
  const d = new Date(ms);
  if (Number.isNaN(d.getTime())) return null;
  const y = d.getUTCFullYear(), mo = String(d.getUTCMonth()+1).padStart(2,'0'), da = String(d.getUTCDate()).padStart(2,'0');
  return `${y}-${mo}-${da}`;
}
function anyDateLikeToISO(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return isExcelSerialDate(v) ? excelSerialToISO(v) : null;
  const s = String(v).trim();
  if (!s || s === '-') return null;
  if (/^\d+(\.\d+)?$/.test(s)) return isExcelSerialDate(Number(s)) ? excelSerialToISO(Number(s)) : null;
  return parseData(s);
}
function isinLike(s) {
  return /^[A-Z]{2}[A-Z0-9]{9}[0-9]$/.test(String(s || '').trim().toUpperCase());
}
function inPeriod(dateStr, period) {
  if (!dateStr) return false;
  const [y, m] = dateStr.split('-');
  if (Number(y) !== period.anno) return false;
  if (period.mese === null) return true;
  return Number(m) === period.mese;
}

function categorizza(descrizioneRaw) {
  const d = (descrizioneRaw || '').toLowerCase();
  if (/revolut/.test(d)) return 'revolut';
  if (/compravendita titoli|dossier titoli|riten\.?\s*etf|ritenuta su cedole|riten\.?\s*divid|isin|titoli|azioni|eseguito ordine|acquisto fondo|vendita fondo|\bborsa\b|comparto|\betf\b/.test(d)) return 'investimento';
  if (/carta di credito|carta credito|addebito carta|pagamento carta|utilizzo carta/.test(d)) return 'carta';
  if (/enel|eni gas|\bgas\b|\bluce\b|\bacqua\b|telecom|\btim\b|vodafone|\bwind\b|fastweb|bolletta|utenza|internet telefono e tecnologia/.test(d)) return 'bolletta';
  if (/netflix|spotify|cinema|ristorante|\bbar\b|pizzeria|svago|prime video|disney|steam|hotel ristoranti e viaggi/.test(d)) return 'svago';
  if (/affitto|condominio|mutuo|\bcasa\b|ristrutturazione/.test(d)) return 'casa';
  return 'spesa';
}

function calcolaIRPEF(reddito) {
  const r = Math.max(0, reddito || 0);
  if (r <= 28000) return r * 0.23;
  if (r <= 50000) return 28000*0.23 + (r-28000)*0.35;
  return 28000*0.23 + 22000*0.35 + (r-50000)*0.43;
}
function buildProiezionePensione(importoMensile, anni) {
  const rate = Math.pow(1.04, 1/12) - 1;
  let capitale = 0, versato = 0;
  const punti = [{ anno: 0, capitale: 0, versato: 0 }];
  const n = Math.max(0, Math.round(anni));
  for (let m = 1; m <= n*12; m++) {
    capitale = capitale * (1 + rate) + importoMensile;
    versato += importoMensile;
    if (m % 12 === 0) punti.push({ anno: m/12, capitale, versato });
  }
  return punti;
}

  const col2 = Math.max(300, Math.floor((W - gap) / 2));
  const entrate = [
    { id:'form', x:0, y:0, w:col2, h:360 },
    { id:'donut', x:col2+gap, y:0, w:col2, h:360 },
  ];

  const mNarrow = Math.max(280, Math.floor(W * 0.33));
  const mWide = Math.max(380, W - mNarrow - gap);
  const mFullW = mNarrow + gap + mWide;
  const movimenti = [
    { id:'carica', x:0, y:0, w:mNarrow, h:540 },
    { id:'tabella', x:mNarrow+gap, y:0, w:mWide, h:540 },
    { id:'categorie', x:0, y:540+gap, w:mFullW, h:220 },
    { id:'fido', x:0, y:540+gap+220+gap, w:mFullW, h:300 },
  ];

  const iNarrow = Math.max(280, Math.floor(W * 0.3));
  const iWide = Math.max(380, W - iNarrow - gap);
  const iFullW = iNarrow + gap + iWide;
  const investimenti = [
    { id:'carica_massimiliano', x:0, y:0, w:iNarrow, h:320 },
    { id:'portafoglio_massimiliano', x:iNarrow+gap, y:0, w:iWide, h:320 },
    { id:'sottoportafogli', x:0, y:320+gap, w:iFullW, h:400 },
  ];

  const pNarrow = Math.max(280, Math.floor(W * 0.28));
  const pWide = Math.max(380, W - pNarrow - gap);
  const pFullW = pNarrow + gap + pWide;
  const pensione = [
    { id:'input', x:0, y:0, w:pNarrow, h:380 },
    { id:'proiezione', x:pNarrow+gap, y:0, w:pWide, h:380 },
    { id:'risparmio', x:0, y:380+gap, w:pFullW, h:280 },
  ];

  const fNarrow = Math.max(280, Math.floor(W * 0.28));
  const fWide = Math.max(380, W - fNarrow - gap);
  const fFullW = fNarrow + gap + fWide;
  const finanziamenti = [
    { id:'gestisci', x:0, y:0, w:fNarrow, h:420 },
    { id:'elenco', x:fNarrow+gap, y:0, w:fWide, h:420 },
    { id:'riepilogo', x:0, y:420+gap, w:fFullW, h:220 },
  ];

  const aNarrow = Math.max(280, Math.floor(W * 0.28));
  const aWide = Math.max(380, W - aNarrow - gap);
  const aFullW = aNarrow + gap + aWide;
  const agenda = [
    { id:'aggiungi', x:0, y:0, w:aNarrow, h:420 },
    { id:'elenco', x:aNarrow+gap, y:0, w:aWide, h:420 },
    { id:'riepilogo', x:0, y:420+gap, w:aFullW, h:200 },
  ];

  return { riepilogo, entrate, movimenti, investimenti, pensione, finanziamenti, agenda };
}

function DonutChart({ data, size=150 }) {
  const total = data.reduce((s,d)=>s+Math.max(0,d.value),0) || 1;
  const segments = useMemo(() => {
    let acc = 0;
    return data.map(d => {
      const frac = Math.max(0,d.value) / total;
      const seg = { ...d, frac, offset: acc };
      acc += frac;
      return seg;
    });
  }, [data, total]);
  const R = 40, C = 2*Math.PI*R;
  return (
    <div className="flex flex-col items-center justify-center h-full w-full gap-4">
      <svg viewBox="0 0 120 120" style={{ width: size, height: size }}>
        <g transform="translate(60,60) rotate(-90)">
          <circle r={R} fill="none" stroke="#f4f4f5" strokeWidth="16" />
          {segments.map((s,i) => (
            <circle key={i} r={R} fill="none" stroke={s.color} strokeWidth="16"
              strokeDasharray={`${s.frac*C} ${C - s.frac*C}`}
              strokeDashoffset={-s.offset*C}
              strokeLinecap="butt" />
          ))}
        </g>
        <text x="60" y="56" textAnchor="middle" fontSize="11" fontWeight="800" fill="#18181b">{fmtEUR(total)}</text>
        <text x="60" y="70" textAnchor="middle" fontSize="8" fill="#a1a1aa">Totale mensile</text>
      </svg>
      <div className="w-full grid grid-cols-1 gap-1.5 px-2">
        {data.map((d,i) => (
          <div key={i} className="flex items-center justify-between text-xs">
            <span className="flex items-center gap-2 text-neutral-600"><span className="w-2 h-2 rounded-full" style={{background:d.color}}></span>{d.label}</span>
            <span className="font-semibold text-neutral-800">{fmtEUR(d.value)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function LineChartSVG({ points, color='#4f46e5', valueKey='capitale', height=240 }) {
  const width = 640;
  const pad = 34;
  const maxY = Math.max(...points.map(p=>p[valueKey]), 1);
  const maxX = Math.max(...points.map(p=>p.anno), 1);
  const toX = (x) => pad + (x/maxX)*(width-pad*2);
  const toY = (y) => (height-pad) - (y/maxY)*(height-pad*2);
  const path = points.map((p,i) => `${i===0?'M':'L'} ${toX(p.anno).toFixed(1)} ${toY(p[valueKey]).toFixed(1)}`).join(' ');
  const areaPath = points.length ? `${path} L ${toX(points[points.length-1].anno).toFixed(1)} ${height-pad} L ${toX(points[0].anno).toFixed(1)} ${height-pad} Z` : '';
  const gridId = 'grad-' + valueKey;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height="100%" preserveAspectRatio="none" style={{ minHeight: 180 }}>
      <defs>
        <linearGradient id={gridId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.28" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {[0,0.25,0.5,0.75,1].map((t,i) => {
        const y = (height-pad) - t*(height-pad*2);
        return <line key={i} x1={pad} x2={width-pad} y1={y} y2={y} stroke="#f1f1f2" strokeWidth="1" />;
      })}
      <path d={areaPath} fill={`url(#${gridId})`} stroke="none" />
      <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((p,i) => (
        <circle key={i} cx={toX(p.anno)} cy={toY(p[valueKey])} r="3.2" fill="white" stroke={color} strokeWidth="2" />
      ))}
      {points.map((p,i) => (
        (i===0 || i===points.length-1 || i % Math.ceil(points.length/6)===0) &&
        <text key={'t'+i} x={toX(p.anno)} y={height-8} textAnchor="middle" fontSize="9" fill="#a1a1aa">Anno {p.anno}</text>
      ))}
    </svg>
  );
}

/* ============================== DRAG / RESIZE GRID ENGINE ============================== */

function Widget({ dashKey, id, title, icon: Icon, layout, onLayoutChange, children, accent='text-neutral-500' }) {
  const dragRef = useRef(null);
  const resizeRef = useRef(null);

  const onDragMove = useCallback((e) => {
    if (!dragRef.current) return;
    const dx = e.clientX - dragRef.current.sx;
    const dy = e.clientY - dragRef.current.sy;
    onLayoutChange(id, { x: Math.max(0, dragRef.current.ox + dx), y: Math.max(0, dragRef.current.oy + dy) });
  }, [id, onLayoutChange]);
  const onDragEnd = useCallback(() => {
    dragRef.current = null;
    document.body.style.cursor = '';
    document.body.classList.remove('no-select');
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup', onDragEnd);
  }, [onDragMove]);
  const startDrag = (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    dragRef.current = { sx: e.clientX, sy: e.clientY, ox: layout.x, oy: layout.y };
    document.body.style.cursor = 'move';
    document.body.classList.add('no-select');
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
  };

  const onResizeMove = useCallback((e) => {
    if (!resizeRef.current) return;
    const dw = e.clientX - resizeRef.current.sx;
    const dh = e.clientY - resizeRef.current.sy;
    onLayoutChange(id, { w: Math.max(280, resizeRef.current.ow + dw), h: Math.max(160, resizeRef.current.oh + dh) });
  }, [id, onLayoutChange]);
  const onResizeEnd = useCallback(() => {
    resizeRef.current = null;
    document.body.style.cursor = '';
    document.body.classList.remove('no-select');
    document.removeEventListener('mousemove', onResizeMove);
    document.removeEventListener('mouseup', onResizeEnd);
  }, [onResizeMove]);
  const startResize = (e) => {
    e.preventDefault(); e.stopPropagation();
    resizeRef.current = { sx: e.clientX, sy: e.clientY, ow: layout.w, oh: layout.h };
    document.body.style.cursor = 'nwse-resize';
    document.body.classList.add('no-select');
    document.addEventListener('mousemove', onResizeMove);
    document.addEventListener('mouseup', onResizeEnd);
  };

  return (
    <div style={{ position:'absolute', left: layout.x, top: layout.y, width: layout.w, height: layout.h }}
      className="bg-white border border-neutral-200 rounded-2xl shadow-sm hover:shadow-md transition-shadow flex flex-col overflow-hidden fade-in">
      <div onMouseDown={startDrag} className="no-select flex items-center justify-between gap-2 px-4 py-3 border-b border-neutral-100 cursor-move bg-neutral-50/60 shrink-0">
        <div className="flex items-center gap-2 min-w-0">
          <Icon size={16} className={accent + " shrink-0"} />
          <span className="text-sm font-semibold text-neutral-800 truncate">{title}</span>
        </div>
        <Icons.GripVertical size={14} className="text-neutral-300 shrink-0" />
      </div>
      <div className="flex-1 overflow-auto min-h-0">{children}</div>
      <div onMouseDown={startResize}
        className="absolute bottom-0 right-0 w-6 h-6 cursor-nwse-resize flex items-end justify-end p-1.5 text-neutral-300 hover:text-neutral-600 transition-colors">
        <Icons.Maximize2 size={12} />
      </div>
    </div>
  );
}

function useIsMobile(breakpoint) {
  const bp = breakpoint || 860;
  const [isMobile, setIsMobile] = useState(() => typeof window !== 'undefined' ? window.innerWidth < bp : false);
  useEffect(() => {
    if (typeof window === 'undefined') return;
    const mq = window.matchMedia(`(max-width: ${bp - 1}px)`);
    const handler = () => setIsMobile(mq.matches);
    handler();
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, [bp]);
  return isMobile;
}

function StackedWidget({ title, icon: Icon, accent='text-neutral-500', children }) {
  return (
    <div className="bg-white border border-neutral-200 rounded-2xl shadow-sm overflow-hidden flex flex-col">
      <div className="flex items-center gap-2 px-4 py-3 border-b border-neutral-100 bg-neutral-50/60 shrink-0">

        <span className="text-sm font-semibold text-neutral-800 truncate">{title}</span>
      </div>
      <div className="max-h-[75vh] overflow-auto">{children}</div>
    </div>
  );
}

function GridCanvas({ dashKey, widgets }) {
  const { layouts, setLayouts } = useApp();
  const isMobile = useIsMobile();
  const layout = layouts[dashKey];
  const onLayoutChange = useCallback((id, patch) => {
    setLayouts(prev => ({ ...prev, [dashKey]: prev[dashKey].map(w => w.id === id ? { ...w, ...patch } : w) }));
  }, [dashKey, setLayouts]);

  if (isMobile) {
    return (
      <div className="flex flex-col gap-4 pb-8">
        {widgets.map(w => (
          <StackedWidget key={w.id} title={w.title} icon={w.icon} accent={w.accent}>{w.render}</StackedWidget>
        ))}
      </div>
    );
  }

  const height = Math.max(400, ...layout.map(w => w.y + w.h + 32));
  const width = Math.max(600, ...layout.map(w => w.x + w.w + 32));
  return (
    <div className="relative" style={{ height, width }}>
      {widgets.map(w => {
        const l = layout.find(x => x.id === w.id);
        if (!l) return null;
        return (
          <Widget key={w.id} dashKey={dashKey} id={w.id} title={w.title} icon={w.icon} accent={w.accent} layout={l} onLayoutChange={onLayoutChange}>
            {w.render}
          </Widget>
        );
      })}
    </div>
  );
}

function SaveProgressButton() {
  const { saveProgress, lastSaved, driveConnected, driveStatus } = useApp();
  const [justSaved, setJustSaved] = useState(false);
  const [saving, setSaving] = useState(false);
  const handleClick = async () => {
    setSaving(true);
    await saveProgress();
    setSaving(false);
    setJustSaved(true);
    setTimeout(() => setJustSaved(false), 1800);
  };
  const busy = saving || driveStatus === 'syncing';
  const title = (lastSaved ? `Ultimo salvataggio: ${lastSaved.toLocaleTimeString('it-IT')} · ${lastSaved.toLocaleDateString('it-IT')}` : 'Nessun salvataggio ancora effettuato') +
    (driveConnected ? ' · Google Drive collegato' : '');
  return (
    <button onClick={handleClick} disabled={busy} title={title}
      className={"inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border text-sm font-medium transition-colors disabled:opacity-60 " +
        (justSaved ? "bg-emerald-50 border-emerald-200 text-emerald-700" : "bg-white border-neutral-200 text-neutral-500 hover:text-neutral-900 hover:border-neutral-300")}>
      {busy ? <Icons.Loader2 size={14} className="animate-spin" /> : justSaved ? <Icons.Check size={14} /> : driveConnected ? <Icons.Cloud size={14} /> : <Icons.Save size={14} />}

  );
}

function computeFidoStats(fido) {
  const totale = Number(fido.totale) || 0;
  const versato = Math.min(totale, Math.max(0, Math.abs(Number(fido.saldoAttuale) || 0)));
  const mancante = Math.max(0, totale - versato);
  const pctMancante = totale > 0 ? Math.min(100, Math.max(0, (mancante / totale) * 100)) : 0;
  const pctVersato = totale > 0 ? Math.min(100, Math.max(0, (versato / totale) * 100)) : 0;
  const completato = totale > 0 && versato >= totale;
  return { totale, versato, mancante, pctMancante, pctVersato, completato };
}

function FidoProgressBar({ pct, completato }) {
  return (
    <div className="w-full h-3 rounded-full bg-neutral-100 overflow-hidden">
      <div className={"h-full rounded-full transition-all " + (completato ? "bg-emerald-500" : pct > 60 ? "bg-emerald-400" : pct > 25 ? "bg-amber-400" : "bg-rose-400")}
        style={{ width: `${Math.max(3, pct)}%` }}></div>
    </div>
  );
}

function FidoSummaryCard() {
  const { fido } = useApp();
  const { totale, mancante, pctVersato, completato } = computeFidoStats(fido);
  return (
    <div className="h-full flex flex-col justify-between p-4">
      <div className="flex items-center justify-between">
        <div className={"w-8 h-8 rounded-xl flex items-center justify-center " + (completato ? "bg-emerald-100 text-emerald-600" : "bg-amber-100 text-amber-600")}>

        </div>
        <span className={"text-xs font-bold " + (completato ? "text-emerald-600" : "text-neutral-600")}>{pctVersato.toFixed(0)}%</span>
      </div>
      <div>
        <FidoProgressBar pct={pctVersato} completato={completato} />
        <p className="text-lg font-bold text-neutral-900 tracking-tight mt-2">{fmtEUR(mancante)} <span className="text-xs font-medium text-neutral-400">da dare / {fmtEUR(totale)}</span></p>
        <p className="text-xs text-neutral-500 mt-0.5">
          {completato ? 'Fido azzerato — nessun rientro dovuto' : `Totale da dare: ${fmtEUR(mancante)} (${((100-pctVersato)).toFixed(0)}%)`}
        </p>
      </div>
    </div>
  );
}

  finanziamento: { label: 'Finanziamento', badge: 'bg-violet-50 text-violet-700 border-violet-200', dot: 'bg-violet-400' },

function computeFinanziamentiStats(items) {
  const attivi = items.filter(i => i.attivo);
  const estinti = items.filter(i => !i.attivo);
  const mutui = attivi.filter(i => i.tipo === 'mutuo');
  const finanziamenti = attivi.filter(i => i.tipo === 'finanziamento');
  const rataMutui = mutui.reduce((s,i) => s + (Number(i.rataMensile) || 0), 0);
  const rataFinanziamenti = finanziamenti.reduce((s,i) => s + (Number(i.rataMensile) || 0), 0);
  const rataTotale = rataMutui + rataFinanziamenti;
  const debitoResiduoTotale = attivi.reduce((s,i) => s + (Number(i.debitoResiduo) || 0), 0);
  return { attivi, estinti, mutui, finanziamenti, rataMutui, rataFinanziamenti, rataTotale, debitoResiduoTotale };
}

const MAX_RICEVUTA_BYTES = 3 * 1024 * 1024;

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('Lettura file fallita'));
    reader.readAsDataURL(file);
  });
}

function computeAgendaStats(agenda, period) {
  const filtrati = agenda.filter(a => inPeriod(a.scadenza, period));
  const totale = filtrati.reduce((s,a) => s + (Number(a.importo) || 0), 0);
  const pagato = filtrati.filter(a => a.pagato).reduce((s,a) => s + (Number(a.importo) || 0), 0);
  const daPagare = Math.max(0, totale - pagato);
  return { filtrati, totale, pagato, daPagare, count: filtrati.length, countPagati: filtrati.filter(a=>a.pagato).length };
}

function AgendaSummaryCard() {
  const { agenda, period } = useApp();
  const { totale, pagato, daPagare, count } = computeAgendaStats(agenda, period);
  const label = period.mese === null ? `Anno ${period.anno}` : `${MESI[period.mese-1]} ${period.anno}`;
  return (
    <div className="h-full flex flex-col justify-between p-4">

        <div className="w-8 h-8 rounded-xl flex items-center justify-center bg-sky-100 text-sky-600">

        <span className="text-[10.5px] font-semibold text-neutral-400">{count} voci · {label}</span>
      </div>
      <div>
        <p className="text-2xl font-bold text-neutral-900 tracking-tight">{fmtEUR(daPagare)}</p>
        <p className="text-xs text-neutral-500 mt-1">Da pagare in agenda</p>
        <p className="text-[11px] text-neutral-400 mt-0.5">Totale {fmtEUR(totale)} · Già pagato {fmtEUR(pagato)}</p>
      </div>
    </div>
  );
}

function RiepilogoDashboard() {
  const { period, incomes, extraEntrate, movements, investments, pensione, resetDashboard } = useApp();

  const entrateTot = useMemo(() => {
    const base = Object.values(incomes).reduce((s,v) => s + (Number(v)||0), 0)
      + extraEntrate.reduce((s,e) => s + (Number(e.importo)||0), 0);
    return period.mese === null ? base * 12 : base;
  }, [incomes, extraEntrate, period]);

  const movFiltered = useMemo(() => movements.filter(m => inPeriod(m.data, period)), [movements, period]);
  const uscite = useMemo(() => movFiltered.filter(m => EXPENSE_CATS.includes(m.categoria) && m.importo < 0).reduce((s,m) => s + Math.abs(m.importo), 0), [movFiltered]);
  const cartaTot = useMemo(() => movFiltered.filter(m => m.categoria === 'carta').reduce((s,m) => s + Math.abs(m.importo), 0), [movFiltered]);
  const revolutTot = useMemo(() => movFiltered.filter(m => m.categoria === 'revolut').reduce((s,m) => s + Math.abs(m.importo), 0), [movFiltered]);

  const massValore = useMemo(() => investments.massimiliano.reduce((s,h) => s + h.quantita*h.prezzoCorrente, 0), [investments.massimiliano]);
  const massCosto = useMemo(() => investments.massimiliano.reduce((s,h) => s + h.quantita*h.pma, 0), [investments.massimiliano]);
  const massPL = massValore - massCosto;
  const massPLpct = massCosto > 0 ? (massPL/massCosto)*100 : 0;

  const pensioneProiezione = useMemo(() => buildProiezionePensione(Number(pensione.importoMensile)||0, Number(pensione.anniInvestimento)||0), [pensione]);
  const pensioneFinale = pensioneProiezione.length ? pensioneProiezione[pensioneProiezione.length-1].capitale : 0;

  const salvadanaio = entrateTot - uscite;

  const widgets = [

    { id:'investimenti', title:'Andamento Investimenti', icon: Icons.TrendingUp, accent:'text-violet-500', render: <StatCard icon={Icons.TrendingUp} tone="violet" value={fmtEUR(massValore)} label="Valore di mercato (Fineco + Lombard)" sub={`P&L ${fmtEUR(massPL)}`} trend={massPLpct} /> },
    { id:'carta', title:'Carta di Credito', icon: Icons.CreditCard, accent:'text-rose-500', render: <StatCard icon={Icons.CreditCard} tone="red" value={fmtEUR(cartaTot)} label="Addebiti carta del mese" /> },
    { id:'revolut', title:'Flussi Revolut', icon: Icons.RefreshCw, accent:'text-indigo-500', render: <StatCard icon={Icons.RefreshCw} tone="indigo" value={fmtEUR(revolutTot)} label="Giroconti verso Revolut" sub="Alimenti & Ludico" /> },
    { id:'pensione', title:'Pensione Futura', icon: Icons.ShieldCheck, accent:'text-amber-500', render: <StatCard icon={Icons.ShieldCheck} tone="amber" value={fmtEUR(pensioneFinale)} label="Valore finale fondo stimato" sub={`${pensione.anniInvestimento} anni al 4%`} /> },
    { id:'salvadanaio', title:'Salvadanaio', icon: Icons.PiggyBank, accent: positivo ? 'text-emerald-500' : 'text-rose-500', render: (
      <div className="h-full flex flex-col justify-between p-4">
        <div className="flex items-center justify-between">
          <div className={"w-8 h-8 rounded-xl flex items-center justify-center " + (positivo ? "bg-emerald-100 text-emerald-600" : "bg-rose-100 text-rose-600")}>

            {positivo ? 'IN POSITIVO' : 'ATTENZIONE'}

const FINECO_HEADER_ALIASES = {
  dataOperazione: ['data_operazione', 'data operazione'],
  dataValuta: ['data_valuta', 'data valuta'],
  entrate: ['entrate'],
  uscite: ['uscite'],
  descrizione: ['descrizione'],
  descrizioneCompleta: ['descrizione_completa', 'descrizione completa'],
  stato: ['stato'],
  moneymap: ['moneymap', 'money map', 'categoria'],
};
function normHeaderCell(s) {
  return String(s || '').toLowerCase().trim().replace(/[_\s]+/g, ' ');
}
function detectFinecoHeaderRow(rows) {
  const limit = Math.min(rows.length, 30);
  for (let i = 0; i < limit; i++) {
    const row = rows[i] || [];
    const norm = row.map(normHeaderCell);
    const idxOf = (aliases) => norm.findIndex(c => aliases.includes(c));
    const descIdx = idxOf(FINECO_HEADER_ALIASES.descrizione);
    const usciteIdx = idxOf(FINECO_HEADER_ALIASES.uscite);
    if (descIdx !== -1 && usciteIdx !== -1) {
      return {
        rowIndex: i,
        dataOperazione: idxOf(FINECO_HEADER_ALIASES.dataOperazione),
        dataValuta: idxOf(FINECO_HEADER_ALIASES.dataValuta),
        entrate: idxOf(FINECO_HEADER_ALIASES.entrate),
        uscite: usciteIdx,
        descrizione: descIdx,
        descrizioneCompleta: idxOf(FINECO_HEADER_ALIASES.descrizioneCompleta),
        stato: idxOf(FINECO_HEADER_ALIASES.stato),
        moneymap: idxOf(FINECO_HEADER_ALIASES.moneymap),
      };
    }
  }
  return null;
}
function parseFinecoRows(rows, map) {
  const out = [];
  const get = (row, idx) => (idx === -1 || idx === undefined) ? undefined : row[idx];
  for (let i = map.rowIndex + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length === 0) continue;
    const nEntrate = parseImporto(get(row, map.entrate));
    const nUscite = parseImporto(get(row, map.uscite));
    if (nEntrate === null && nUscite === null) continue;
    const importo = (nEntrate !== null && nEntrate !== 0) ? Math.abs(nEntrate) : (nUscite !== null ? -Math.abs(nUscite) : null);
    if (importo === null) continue;
    const dataISO = anyDateLikeToISO(get(row, map.dataOperazione)) || anyDateLikeToISO(get(row, map.dataValuta));
    if (!dataISO) continue;
    const descBase = String(get(row, map.descrizione) || '').trim();
    const descFull = String(get(row, map.descrizioneCompleta) || '').trim();
    const moneymap = String(get(row, map.moneymap) || '').trim().toLowerCase();
    const combined = (descBase + ' ' + descFull).toLowerCase();
    let categoria;
    if (/revolut/.test(combined)) categoria = 'revolut';
    else if (/compravendita titoli|dossier titoli|riten\.?\s*etf|ritenuta su cedole|riten\.?\s*divid/.test(combined)) categoria = 'investimento';
    else if (/carta di credito|carta credito|utilizzo carta/.test(combined)) categoria = 'carta';
    else if (MONEYMAP_TO_CAT[moneymap]) categoria = MONEYMAP_TO_CAT[moneymap];
    else categoria = categorizza(combined);
    const descrizioneFinale = (descFull && descFull.length > 2 ? descFull : (descBase || 'Movimento')).slice(0, 160);
    out.push({ id: uid(), data: dataISO, descrizione: descrizioneFinale, importo, categoria });
  }
  return out;
}
function parseRowsToMovimentiGeneric(rows) {
  const out = [];
  for (const row of rows) {
    const cells = Array.isArray(row) ? row : Object.values(row);
    if (!cells || cells.length === 0) continue;
    let data = null, importo = null, descParts = [];
    for (const c of cells) {
      if (data === null) { const d = anyDateLikeToISO(c); if (d) { data = d; continue; } }
    }
    for (let i = cells.length - 1; i >= 0; i--) {
      const n = parseImporto(cells[i]);
      if (n !== null && importo === null) { importo = n; continue; }
      if (cells[i] !== null && cells[i] !== undefined && String(cells[i]).trim() !== '') descParts.push(String(cells[i]).trim());
    }
    if (data === null || importo === null) continue;
    const descrizione = descParts.reverse().join(' ').trim() || 'Movimento';
    out.push({ id: uid(), data, descrizione, importo, categoria: categorizza(descrizione) });
  }
  return out;
}
function parseRowsToMovimenti(rows) {
  const finecoMap = detectFinecoHeaderRow(rows);
  if (finecoMap) {
    const parsed = parseFinecoRows(rows, finecoMap);
    if (parsed.length > 0) return parsed;
  }
  return parseRowsToMovimentiGeneric(rows);
}
function parsePastedText(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const rows = lines.map(l => l.split(/;|\t|,(?=[^,]*$)/).map(s => s.trim()));
  return parseRowsToMovimenti(rows);
}

function Dropzone({ onFilesRows, onMockFile, mockKind, label, sub, icon: Icon }) {
  const [over, setOver] = useState(false);
  const fileInputRef = useRef(null);

  const handleRealFile = (file) => {
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true });
        onFilesRows(rows, file.name);
      } catch (err) {
        onFilesRows([], file.name, true);
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const handleDrop = (e) => {
    e.preventDefault(); setOver(false);
    const internalId = e.dataTransfer.getData('application/x-estrazione-id');
    if (internalId) { onMockFile(internalId); return; }
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) handleRealFile(file);
  };

  return (
    <div
      onDragOver={(e) => { e.preventDefault(); setOver(true); }}
      onDragLeave={() => setOver(false)}
      onDrop={handleDrop}
      onClick={() => fileInputRef.current && fileInputRef.current.click()}
      className={"cursor-pointer border-2 border-dashed rounded-xl px-4 py-6 flex flex-col items-center justify-center text-center gap-1.5 transition-colors " +
        (over ? "border-neutral-900 bg-neutral-50" : "border-neutral-200 hover:border-neutral-300 hover:bg-neutral-50/60")}>
      <Icon size={20} className="text-neutral-400 mb-1" />
      <p className="text-xs font-semibold text-neutral-700">{label}</p>
      {sub && <p className="text-[10.5px] text-neutral-400">{sub}</p>}
      <input ref={fileInputRef} type="file" accept=".csv,.xlsx,.xls" className="hidden"
        onChange={(e) => { const f = e.target.files[0]; if (f) handleRealFile(f); e.target.value=''; }} />
    </div>
  );
}

function MovimentiDashboard() {

  const [filterCat, setFilterCat] = useState('tutte');
  const [manual, setManual] = useState({ data:'', descrizione:'', importo:'' });

  const mergeDedup = (parsed, sourceLabel, emptyMsg) => {
    if (parsed.length === 0) { pushToast(emptyMsg, 'warn'); return; }
    let addedCount = 0, dupCount = 0;
    setMovements(prev => {
      const existingKeys = new Set(prev.map(movementKey));
      const fresh = [];
      for (const m of parsed) {
        const k = movementKey(m);
        if (existingKeys.has(k)) { dupCount++; continue; }
        existingKeys.add(k);
        fresh.push(m);
      }
      addedCount = fresh.length;
      return fresh.length > 0 ? [...fresh, ...prev] : prev;
    });
    if (addedCount === 0) {
      pushToast(`Nessun movimento nuovo: tutte le ${dupCount} righe di ${sourceLabel} erano già presenti.`, 'warn');
    } else if (dupCount > 0) {
      pushToast(`${addedCount} nuovi movimenti importati da ${sourceLabel} (${dupCount} già presenti, ignorati)`);
    } else {
      pushToast(`${addedCount} movimenti importati da ${sourceLabel}`);
    }
  };
  const onFilesRows = (rows, filename, error) => {
    if (error) { pushToast('Non riesco a leggere ' + filename + '.', 'error'); return; }
    const parsed = parseRowsToMovimenti(rows);
    mergeDedup(parsed, filename, 'Nessun movimento riconosciuto in ' + filename + '. Aggiungilo manualmente.');
  };
  const onMockFile = (fileId) => {
    const backup = estrazioniBackups.find(b => b.id === fileId);
    if (backup) {
      const parsed = backup.movimenti.map(m => ({ ...m, id: uid() }));
      mergeDedup(parsed, backup.name, 'Questo backup non contiene movimenti.');
      return;
    }
    const meta = ESTRAZIONI_FILES.find(f => f.id === fileId);
    if (!meta || meta.kind !== 'movimenti') { pushToast('Questo file non contiene movimenti bancari.', 'warn'); return; }
    const rows = mockMovimenti(fileId);
    const parsed = parseRowsToMovimenti(rows);
    mergeDedup(parsed, meta.name, 'Nessun movimento riconosciuto in ' + meta.name + '.');
  };
  const salvaBackup = () => {
    if (movements.length === 0) { pushToast('Nessun movimento da salvare.', 'warn'); return; }
    const backup = makeMovimentiBackup(movements);
    setEstrazioniBackups(prev => [backup, ...prev].slice(0, 10));
    pushToast(`Backup di ${movements.length} movimenti salvato in Cartella Estrazioni`);
  };
  const handlePasteImport = () => {
    const parsed = parsePastedText(pasteText);
    if (parsed.length > 0) setPasteText('');
    mergeDedup(parsed, 'testo incollato', 'Nessuna riga valida trovata. Formato: data;descrizione;importo');
  };
  const handleManualAdd = () => {
    const data = parseData(manual.data) || manual.data;
    const importo = parseImporto(manual.importo);
    if (!data || !manual.descrizione || importo === null) { pushToast('Compila data, descrizione e importo.', 'warn'); return; }
    setMovements(prev => [{ id: uid(), data, descrizione: manual.descrizione, importo, categoria: categorizza(manual.descrizione) }, ...prev]);
    setManual({ data:'', descrizione:'', importo:'' });
    pushToast('Movimento aggiunto');
  };
  const removeMovement = (id) => {
    const removed = movements.find(m => m.id === id);
    setMovements(prev => prev.filter(m => m.id !== id));
    if (removed) {
      pushToast('Movimento eliminato', 'warn', { label: 'Annulla', onClick: () => setMovements(prev => [removed, ...prev]) });
    }
  };

  const inPeriodMovements = useMemo(() => movements.filter(m => inPeriod(m.data, period)), [movements, period]);

  const filtered = useMemo(() => inPeriodMovements
    .filter(m => filterCat === 'tutte' || m.categoria === filterCat)
    .filter(m => m.descrizione.toLowerCase().includes(search.toLowerCase()))
    .sort((a,b) => b.data.localeCompare(a.data)), [inPeriodMovements, filterCat, search]);

  const catCounts = useMemo(() => {
    const c = {};
    inPeriodMovements.forEach(m => { c[m.categoria] = (c[m.categoria]||0) + 1; });
    return c;
  }, [inPeriodMovements]);

  const catBreakdown = useMemo(() => {
    const totals = {};
    inPeriodMovements.forEach(m => { totals[m.categoria] = (totals[m.categoria] || 0) + Math.abs(m.importo); });
    return Object.keys(CATEGORY_META)

      .filter(x => x.count > 0)
      .sort((a,b) => b.total - a.total);
  }, [inPeriodMovements, catCounts]);
  const maxCatTotal = Math.max(1, ...catBreakdown.map(x => x.total));

        <Dropzone icon={Icons.FileSpreadsheet} label="Trascina un estratto conto" sub="CSV / XLSX o file dalla Cartella Estrazioni" onFilesRows={onFilesRows} onMockFile={onMockFile} />
        <div>

          <textarea value={pasteText} onChange={(e)=>setPasteText(e.target.value)} rows={4}

            className="w-full px-3 py-2 rounded-lg border border-neutral-200 bg-white text-xs font-mono placeholder-neutral-300 focus:outline-none focus:ring-2 focus:ring-neutral-900/10 focus:border-neutral-400" />

        </div>
        <div className="pt-3 border-t border-neutral-100">

            <TextInput type="date" value={manual.data} onChange={(e)=>setManual(m=>({...m,data:e.target.value}))} />
            <TextInput type="text" placeholder="Importo (es. -45,90)" value={manual.importo} onChange={(e)=>setManual(m=>({...m,importo:e.target.value}))} />
          </div>
          <TextInput type="text" placeholder="Descrizione" value={manual.descrizione} onChange={(e)=>setManual(m=>({...m,descrizione:e.target.value}))} className="mb-2" />
          <PrimaryBtn onClick={handleManualAdd} icon={Icons.Plus} className="w-full">Aggiungi movimento</PrimaryBtn>
        </div>
      </div>
    ) },
    { id:'tabella', title:'Movimenti & Riconciliazione', icon: Icons.ArrowLeftRight, accent:'text-neutral-500', render: (
      <div className="p-4 h-full flex flex-col">
        <div className="flex items-center gap-2 mb-3">
          <div className="relative flex-1">
            <Icons.Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400" />
            <TextInput type="text" placeholder="Cerca movimento..." value={search} onChange={(e)=>setSearch(e.target.value)} className="pl-8" />
          </div>
          <select value={period.mese === null ? 'tutti' : period.mese}
            onChange={(e) => setPeriod(p => ({ ...p, mese: e.target.value === 'tutti' ? null : Number(e.target.value) }))}
            className="text-xs font-medium bg-neutral-50 border border-neutral-200 rounded-lg px-2 py-2 text-neutral-700 focus:outline-none focus:ring-2 focus:ring-neutral-900/10 shrink-0">
            <option value="tutti">Tutti i mesi</option>
            {MESI.map((m,i) => <option key={i} value={i+1}>{m}</option>)}
          </select>
          <select value={period.anno}

            {ANNI.map(a => <option key={a} value={a}>{a}</option>)}

        </div>
        <div className="flex flex-wrap gap-1.5 mb-3">
          <GhostBtn active={filterCat==='tutte'} onClick={()=>setFilterCat('tutte')}>Tutte ({inPeriodMovements.length})</GhostBtn>

          ) : null)}
        </div>
        {filtered.length === 0 ? (

function detectPortafoglioHeaderRow(rows) {

    const row = rows[i] || [];
    const norm = row.map(normHeaderCell);
    const idxOf = (aliases) => norm.findIndex(c => aliases.includes(c));
    const isinIdx = idxOf(PORTAFOGLIO_HEADER_ALIASES.isin);
    const pmaIdx = idxOf(PORTAFOGLIO_HEADER_ALIASES.pma);
    if (isinIdx !== -1 && pmaIdx !== -1) {
      return {
        rowIndex: i,
        titolo: idxOf(PORTAFOGLIO_HEADER_ALIASES.titolo),
        isin: isinIdx,
        quantita: idxOf(PORTAFOGLIO_HEADER_ALIASES.quantita),
        pma: pmaIdx,
        prezzoCorrente: idxOf(PORTAFOGLIO_HEADER_ALIASES.prezzoCorrente),
        valoreDiCarico: idxOf(PORTAFOGLIO_HEADER_ALIASES.valoreDiCarico),
        valoreDiMercato: idxOf(PORTAFOGLIO_HEADER_ALIASES.valoreDiMercato),
      };
    }
  }
  return null;
}
function parsePortafoglioRows(rows, map) {
  const out = [];
  const get = (row, idx) => (idx === -1 || idx === undefined) ? undefined : row[idx];
  for (let i = map.rowIndex + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length === 0) continue;
    const isinRaw = get(row, map.isin);
    if (!isinLike(isinRaw)) continue;
    const isin = String(isinRaw).trim().toUpperCase();
    const pma = parseImporto(get(row, map.pma));
    if (pma === null) continue;
    const prezzoCorrente = parseImporto(get(row, map.prezzoCorrente)) ?? pma;
    const nome = String(get(row, map.titolo) || isin).trim();
    // Alcuni strumenti (es. obbligazioni/BTP) quotano il prezzo come % del nominale
    // (es. 98,84 = 98,84% di 100), mentre "Quantità" riporta il nominale in EUR.
    // Usiamo "Valore di carico" (già corretto in valuta) per derivare la quantità
    // effettiva, cosi valore = quantita*pma torna sempre esatto qualunque sia la convenzione.
    const valoreDiCarico = parseImporto(get(row, map.valoreDiCarico));
    let quantita = parseImporto(get(row, map.quantita)) ?? 0;
    if (valoreDiCarico !== null && pma > 0) {
      quantita = valoreDiCarico / pma;
    }
    out.push({ id: uid(), isin, nome, pma, quantita, prezzoCorrente });
  }
  return out;
}
function parseRowsToTitoliGeneric(rows) {
  const out = [];
  for (const row of rows) {
    const cells = (Array.isArray(row) ? row : Object.values(row)).filter(c => c !== null && c !== undefined && String(c).trim() !== '');
    if (cells.length === 0) continue;
    let isin = cells.find(c => isinLike(c));
    if (!isin) continue;
    isin = String(isin).trim().toUpperCase();
    const numeric = cells.filter(c => c !== isin && parseImporto(c) !== null && !parseData(c)).map(c => parseImporto(c));
    const nome = cells.filter(c => c !== isin && parseImporto(c) === null).map(c => String(c).trim()).sort((a,b)=>b.length-a.length)[0] || isin;
    const pma = numeric[0] ?? 0;
    const quantita = numeric[1] ?? 0;
    const prezzoCorrente = numeric[2] ?? pma;
    out.push({ id: uid(), isin, nome, pma, quantita, prezzoCorrente });
  }
  return out;
}
function parseRowsToTitoli(rows) {
  const map = detectPortafoglioHeaderRow(rows);
  if (map) {
    const parsed = parsePortafoglioRows(rows, map);
    if (parsed.length > 0) return parsed;
  }
  return parseRowsToTitoliGeneric(rows);
}

function LiveDot({ status }) {
  const map = {
    ok: { cls: 'bg-emerald-500', pulse: true, title: 'Quotazione live aggiornata dalla borsa' },
    error: { cls: 'bg-amber-500', pulse: false, title: 'Ultimo aggiornamento live fallito — prezzo non recente' },
    'no-ticker': { cls: 'bg-neutral-300', pulse: false, title: 'Nessuna quotazione live disponibile (prezzo manuale)' },
    pending: { cls: 'bg-neutral-300', pulse: true, title: 'Verifica quotazione in corso...' },
  };
  const s = map[status] || map.pending;
  return <span title={s.title} className={"inline-block w-1.5 h-1.5 rounded-full shrink-0 " + s.cls + (s.pulse ? " animate-pulse" : "")}></span>;
}

  const totaleValore = titoli.reduce((s,t) => s + t.quantita*t.prezzoCorrente, 0);
  const totaleCosto = titoli.reduce((s,t) => s + t.quantita*t.pma, 0);
  const plTot = totaleValore - totaleCosto;
  const plPct = totaleCosto > 0 ? (plTot/totaleCosto)*100 : 0;
  const liveCount = titoli.filter(t => marketData[t.isin]?.status === 'ok').length;

  if (titoli.length === 0) return <EmptyState icon={Icons.LineChart} text="Nessun titolo. Trascina un file oppure aggiungi una posizione manualmente." />;

  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center justify-between px-1 pb-3 mb-1 border-b border-neutral-100">
        <div className="flex items-center gap-2">
          <span className="text-xs text-neutral-500">Valore attuale</span>
          <span className="text-base font-bold text-neutral-900">{fmtEUR(totaleValore)}</span>
          {liveCount > 0 && <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full bg-emerald-50 text-emerald-600 text-[10px] font-semibold"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>{liveCount} LIVE</span>}

          {plTot >= 0 ? <Icons.ArrowUpRight size={14}/> : <Icons.ArrowDownRight size={14}/>}

        </span>
      </div>
      <div className="overflow-auto flex-1 -mx-1">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left text-[10.5px] text-neutral-400 uppercase tracking-wide">
              <th className="px-2 py-2 font-semibold"></th>
              <th className="px-2 py-2 font-semibold">ISIN</th>
              <th className="px-2 py-2 font-semibold">Titolo</th>
              <th className="px-2 py-2 font-semibold text-right">PMA</th>
              <th className="px-2 py-2 font-semibold text-right">Qtà</th>

                    {t.isin}
                    {md?.ticker && <div className="text-[9.5px] text-neutral-300">{md.ticker}</div>}

    const t = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const r = await fetch(buildUrl(targetUrl), { signal: ctrl.signal });
      if (!r.ok) { lastErr = new Error('HTTP ' + r.status); continue; }
      const j = await r.json();
      return j;
    } catch (e) {
      lastErr = e;
      continue;
    } finally {
      clearTimeout(t);
    }
  }
  throw lastErr;
}
async function resolveTickerForISIN(isin) {
  const url = `https://query2.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(isin)}&quotesCount=1&newsCount=0`;
  const j = await fetchViaProxy(url);
  const q = j?.quotes?.[0];
  return q?.symbol || null;
}
async function fetchYahooPrice(ticker) {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}`;
  const j = await fetchViaProxy(url);
  const price = j?.chart?.result?.[0]?.meta?.regularMarketPrice;
  if (typeof price !== 'number') throw new Error('Nessun prezzo');
  return price;
}
async function fetchMarketPriceForISIN(isin, cachedTicker) {
  const ticker = cachedTicker || await resolveTickerForISIN(isin);
  if (!ticker) return { isin, ticker: null, status: 'no-ticker' };
  const price = await fetchYahooPrice(ticker);
  return { isin, ticker, status: 'ok', price };
}

const STORAGE_KEY = 'gflc_progressi_v1';
function loadPersisted() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    return (data && typeof data === 'object') ? data : null;
  } catch (e) {
    return null;
  }
}

/* ============================== GOOGLE DRIVE ============================== */

const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_CLIENT_ID_KEY = 'gflc_drive_client_id';
const DRIVE_FILE_INFO_KEY = 'gflc_drive_file_info';
const DRIVE_FOLDER_NAME = 'Gestione dei Flussi di Casa';
const DRIVE_FILE_NAME = 'dati-gestione-flussi-casa.json';

function getSavedDriveClientId() { return localStorage.getItem(DRIVE_CLIENT_ID_KEY) || ''; }
function saveDriveClientId(id) { localStorage.setItem(DRIVE_CLIENT_ID_KEY, id.trim()); }
function clearDriveClientId() { localStorage.removeItem(DRIVE_CLIENT_ID_KEY); }
function getSavedDriveFileInfo() {
  try { return JSON.parse(localStorage.getItem(DRIVE_FILE_INFO_KEY)); } catch (e) { return null; }
}
function saveDriveFileInfo(info) { localStorage.setItem(DRIVE_FILE_INFO_KEY, JSON.stringify(info)); }
function clearDriveFileInfo() { localStorage.removeItem(DRIVE_FILE_INFO_KEY); }

function waitForGsi(maxWaitMs) {
  return new Promise((resolve) => {
    const start = Date.now();
    const check = () => {
      if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) { resolve(true); return; }
      if (Date.now() - start > maxWaitMs) { resolve(false); return; }
      setTimeout(check, 150);
    };
    check();
  });
}

let gsiTokenClient = null;
function ensureGsiTokenClient(clientId, onToken) {
  if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) return null;
  if (!gsiTokenClient) {
    gsiTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: DRIVE_SCOPE,
      callback: () => {},
    });
  }
  return gsiTokenClient;
}
function requestDriveToken(clientId, interactive) {
  return new Promise((resolve) => {
    const client = ensureGsiTokenClient(clientId);
    if (!client) { resolve(null); return; }
    client.callback = (resp) => {
      if (resp && resp.error) { resolve(null); return; }
      resolve(resp.access_token);
    };
    try {
      client.requestAccessToken({ prompt: interactive ? 'consent' : '' });
    } catch (e) {
      resolve(null);
    }
  });
}

async function driveApi(token, path, options) {
  const res = await fetch('https://www.googleapis.com/drive/v3/' + path, {
    ...options,
    headers: { Authorization: 'Bearer ' + token, ...(options && options.headers) },
  });
  if (!res.ok) throw new Error('Drive API ' + res.status);
  return res.json();
}

async function driveFindOrCreateFolder(token) {
  const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const found = await driveApi(token, `files?q=${q}&fields=files(id,name)&spaces=drive`);
  if (found.files && found.files.length > 0) return found.files[0].id;
  const created = await driveApi(token, 'files?fields=id', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' }),
  });
  return created.id;
}

async function driveFindOrCreateFile(token, folderId, initialContent) {
  const q = encodeURIComponent(`'${folderId}' in parents and name='${DRIVE_FILE_NAME}' and trashed=false`);
  const found = await driveApi(token, `files?q=${q}&fields=files(id,name)&spaces=drive`);
  if (found.files && found.files.length > 0) return found.files[0].id;

  const boundary = 'gflc-boundary-' + uid();
  const metadata = { name: DRIVE_FILE_NAME, parents: [folderId], mimeType: 'application/json' };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${initialContent}\r\n--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': `multipart/related; boundary=${boundary}` },
    body,
  });
  if (!res.ok) throw new Error('Drive upload ' + res.status);
  const created = await res.json();
  return created.id;
}

async function driveDownloadFile(token, fileId) {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { Authorization: 'Bearer ' + token },
  });
  if (!res.ok) throw new Error('Drive download ' + res.status);
  return res.json();
}

async function driveUploadContent(token, fileId, content) {
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: content,
  });
  if (!res.ok) throw new Error('Drive save ' + res.status);
  return res.json();
}

/* ============================== APP ============================== */

function App() {
  const [persisted] = useState(loadPersisted);
  const [view, setView] = useState('riepilogo');
  const [period, setPeriod] = useState(() => persisted?.period ?? { mese: null, anno: 2026 });
  const [incomes, setIncomes] = useState(() => persisted?.incomes ?? DEFAULT_INCOMES);
  const [extraEntrate, setExtraEntrate] = useState(() => persisted?.extraEntrate ?? []);
  const [movements, setMovements] = useState(() => persisted?.movements ?? defaultMovements());
  const [investments, setInvestments] = useState(() => persisted?.investments ?? defaultInvestments());
  const [pensione, setPensione] = useState(() => persisted?.pensione ?? defaultPensione());
  const [fido, setFido] = useState(() => persisted?.fido ?? defaultFido());
  const [hiddenFiles, setHiddenFiles] = useState(() => persisted?.hiddenFiles ?? []);
  const [estrazioniBackups, setEstrazioniBackups] = useState(() => persisted?.estrazioniBackups ?? []);
  const [finanziamenti, setFinanziamenti] = useState(() => persisted?.finanziamenti ?? defaultFinanziamenti());
  const [agenda, setAgenda] = useState(() => persisted?.agenda ?? defaultAgenda());
  const [layouts, setLayouts] = useState(() => persisted?.layouts ?? buildDefaultLayouts(getAvailWidth()));
  const [lastSaved, setLastSaved] = useState(() => persisted?.savedAt ? new Date(persisted.savedAt) : null);
  const [toasts, setToasts] = useState([]);
  const [marketData, setMarketData] = useState({});
  const [isRefreshingPrices, setIsRefreshingPrices] = useState(false);
  const marketDataRef = useRef(marketData);
  marketDataRef.current = marketData;
  const investmentsRef = useRef(investments);
  investmentsRef.current = investments;
  const isMobile = useIsMobile();
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const [driveClientId, setDriveClientIdState] = useState(getSavedDriveClientId);
  const [driveFileInfo, setDriveFileInfoState] = useState(getSavedDriveFileInfo);
  const [driveConnected, setDriveConnected] = useState(false);
  const [driveStatus, setDriveStatus] = useState('idle');
  const [gsiReady, setGsiReady] = useState(false);
  const driveTokenRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    waitForGsi(15000).then((ok) => { if (!cancelled) setGsiReady(ok); });
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    try {
      const manifest = {
        name: 'Gestione dei Flussi di Casa',
        short_name: 'Flussi Casa',
        description: 'Gestione finanziaria familiare: entrate, movimenti, investimenti, mutui, fido e agenda spese.',
        start_url: '.',
        display: 'standalone',
        background_color: '#fafafa',
        theme_color: '#18181b',
        icons: [
          { src: PWA_ICON_SVG, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
          { src: PWA_ICON_SVG, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' },
          { src: PWA_ICON_SVG, sizes: '512x512', type: 'image/svg+xml', purpose: 'maskable' },
        ],
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const url = URL.createObjectURL(blob);
      let link = document.querySelector('link[rel="manifest"]');
      if (!link) { link = document.createElement('link'); link.rel = 'manifest'; document.head.appendChild(link); }
      link.href = url;
      let favicon = document.querySelector('link[rel="icon"]');
      if (!favicon) { favicon = document.createElement('link'); favicon.rel = 'icon'; document.head.appendChild(favicon); }
      favicon.href = PWA_ICON_SVG;
    } catch (e) {}
  }, []);

  const pushToast = useCallback((message, type='ok', action) => {
    const id = uid();
    setToasts(prev => [...prev, { id, message, type, action }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), action ? 6500 : 3500);
  }, []);

  const buildPayload = useCallback(() => ({
    period, incomes, extraEntrate, movements, investments, pensione, fido, hiddenFiles, estrazioniBackups, finanziamenti, agenda, layouts, savedAt: Date.now(),
  }), [period, incomes, extraEntrate, movements, investments, pensione, fido, hiddenFiles, estrazioniBackups, finanziamenti, agenda, layouts]);

  const applyPersistedPayload = useCallback((data) => {
    if (!data || typeof data !== 'object') return;
    if (data.period) setPeriod(data.period);
    if (data.incomes) setIncomes(data.incomes);
    if (data.extraEntrate) setExtraEntrate(data.extraEntrate);
    if (data.movements) setMovements(data.movements);
    if (data.investments) setInvestments(data.investments);
    if (data.pensione) setPensione(data.pensione);
    if (data.fido) setFido(data.fido);
    if (data.hiddenFiles) setHiddenFiles(data.hiddenFiles);
    if (data.estrazioniBackups) setEstrazioniBackups(data.estrazioniBackups);
    if (data.finanziamenti) setFinanziamenti(data.finanziamenti);
    if (data.agenda) setAgenda(data.agenda);
    if (data.layouts) setLayouts(data.layouts);
    if (data.savedAt) setLastSaved(new Date(data.savedAt));
  }, []);

  const setDriveClientId = useCallback((id) => {
    saveDriveClientId(id);
    setDriveClientIdState(id.trim());
    setDriveConnected(false);
    driveTokenRef.current = null;
  }, []);
  const forgetDriveFolder = useCallback(() => {
    clearDriveFileInfo();
    setDriveFileInfoState(null);
    setDriveConnected(false);
    driveTokenRef.current = null;
  }, []);

  const connectDrive = useCallback(async () => {
    const clientId = driveClientId.trim();
    if (!clientId) { pushToast('Incolla prima il Client ID di Google nelle impostazioni.', 'warn'); return; }
    setDriveStatus('connecting');
    const ready = await waitForGsi(12000);
    if (!ready) { setDriveStatus('error'); pushToast('Libreria Google non disponibile (serve una connessione internet e una pagina servita via web, non un file locale).', 'error'); return; }
    const token = await requestDriveToken(clientId, true);
    if (!token) { setDriveStatus('error'); pushToast('Connessione a Google Drive annullata o non riuscita.', 'error'); return; }
    driveTokenRef.current = token;
    try {
      let info = getSavedDriveFileInfo();
      if (!info || !info.folderId || !info.fileId) {
        const folderId = await driveFindOrCreateFolder(token);
        const fileId = await driveFindOrCreateFile(token, folderId, JSON.stringify(buildPayload()));
        info = { folderId, fileId };
        saveDriveFileInfo(info);
        setDriveFileInfoState(info);
        setDriveConnected(true);
        setDriveStatus('idle');
        pushToast(`Cartella "${DRIVE_FOLDER_NAME}" creata su Google Drive`);
        return;
      }
      setDriveConnected(true);
      setDriveStatus('idle');
      try {
        const remote = await driveDownloadFile(token, info.fileId);
        applyPersistedPayload(remote);
        pushToast('Google Drive collegato: dati caricati dal cloud');
      } catch (e) {
        pushToast('Google Drive collegato');
      }
    } catch (e) {
      setDriveStatus('error');
      pushToast('Errore nella configurazione della cartella su Google Drive.', 'error');
    }
  }, [driveClientId, buildPayload, applyPersistedPayload, pushToast]);

  const disconnectDrive = useCallback(() => {
    setDriveConnected(false);
    driveTokenRef.current = null;
    pushToast('Google Drive scollegato per questa sessione');
  }, [pushToast]);

  useEffect(() => {
    if (!driveClientId || !driveFileInfo) return;
    let cancelled = false;
    (async () => {
      const ready = await waitForGsi(12000);
      if (cancelled || !ready) return;
      const token = await requestDriveToken(driveClientId, false);
      if (cancelled || !token) return;
      driveTokenRef.current = token;
      setDriveConnected(true);
      setDriveStatus('syncing');
      try {
        const remote = await driveDownloadFile(token, driveFileInfo.fileId);
        if (!cancelled) applyPersistedPayload(remote);
      } catch (e) {}
      if (!cancelled) setDriveStatus('idle');
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const saveProgress = useCallback(async () => {
    const payload = buildPayload();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      setLastSaved(new Date());
    } catch (e) {
      pushToast('Impossibile salvare: memoria del browser piena o non disponibile.', 'error');
      return;
    }
    if (!driveConnected || !driveFileInfo) {
      pushToast('Progressi salvati sul browser');
      return;
    }
    setDriveStatus('syncing');
    try {
      let token = driveTokenRef.current;
      if (!token) token = await requestDriveToken(driveClientId, false);
      if (!token) { setDriveStatus('error'); pushToast('Salvato sul browser. Riconnetti Google Drive per sincronizzare nel cloud.', 'warn'); return; }
      driveTokenRef.current = token;
      await driveUploadContent(token, driveFileInfo.fileId, JSON.stringify(payload));
      setDriveStatus('idle');
      pushToast('Progressi salvati su Google Drive');
    } catch (e) {
      setDriveStatus('error');
      pushToast('Salvato sul browser, ma la sincronizzazione con Google Drive è fallita.', 'warn');
    }
  }, [buildPayload, driveConnected, driveFileInfo, driveClientId, pushToast]);

  const refreshMarketData = useCallback(async () => {
    setIsRefreshingPrices(true);
    const inv = investmentsRef.current;
    const isins = new Set();
    ['massimiliano', 'giulia', 'cristiano', 'alessandro', 'mamma'].forEach(k => {
      (inv[k] || []).forEach(t => { if (t.isin) isins.add(t.isin); });
    });
    const cached = marketDataRef.current;
    const results = await Promise.allSettled(
      Array.from(isins).map(isin => fetchMarketPriceForISIN(isin, cached[isin]?.ticker))
    );
    const patch = {};
    results.forEach((r, i) => {
      const isin = Array.from(isins)[i];
      if (r.status === 'fulfilled') {
        patch[isin] = { ...r.value, updatedAt: Date.now() };
      } else {
        const prev = cached[isin];
        patch[isin] = { isin, ticker: prev?.ticker || null, status: 'error', price: prev?.price, updatedAt: prev?.updatedAt || null };
      }
    });
    setMarketData(prev => ({ ...prev, ...patch }));
    setInvestments(prev => {
      const applyPrice = (t) => (patch[t.isin] && patch[t.isin].status === 'ok') ? { ...t, prezzoCorrente: patch[t.isin].price } : t;
      return {
        massimiliano: prev.massimiliano.map(applyPrice),
        giulia: prev.giulia.map(applyPrice),
        cristiano: prev.cristiano.map(applyPrice),
        alessandro: prev.alessandro.map(applyPrice),
        mamma: prev.mamma.map(applyPrice),
      };
    });
    setIsRefreshingPrices(false);
  }, []);

  useEffect(() => {
    refreshMarketData();
    const interval = setInterval(refreshMarketData, 60000);
    return () => clearInterval(interval);
  }, [refreshMarketData]);

  const resetDashboard = useCallback((key) => {
    if (key === 'riepilogo') {
      setLayouts(prev => ({ ...prev, riepilogo: buildDefaultLayouts(getAvailWidth()).riepilogo }));
      setPeriod({ mese: null, anno: 2026 });
      pushToast('Riepilogo ripristinato');
    } else if (key === 'entrate') {
      setIncomes(DEFAULT_INCOMES);
      setExtraEntrate([]);
      pushToast('Entrate ripristinate ai valori di base');
    } else if (key === 'movimenti') {
      if (movements.length > 0) {
        const backup = makeMovimentiBackup(movements);
        setEstrazioniBackups(prev => [backup, ...prev].slice(0, 10));
      }
      setMovements([]);
      setFido(defaultFido());
      pushToast(movements.length > 0 ? 'Movimenti salvati in Cartella Estrazioni prima dello svuotamento' : 'Tabella movimenti e fido svuotati');
    } else if (key === 'investimenti') {
      setInvestments({ massimiliano: [], giulia: [], cristiano: [], alessandro: [], mamma: [] });
      pushToast('Tutti i titoli sono stati azzerati');
    } else if (key === 'pensione') {
      setPensione({ dataInizio: '', importoMensile: 0, anniInvestimento: 0, ral: 0 });
      pushToast('Campi pensione azzerati');
    } else if (key === 'finanziamenti') {
      setFinanziamenti(defaultFinanziamenti());
      pushToast('Elenco finanziamenti e mutui ripristinato ai valori di base');
    } else if (key === 'agenda') {
      setAgenda([]);
      pushToast('Agenda spese svuotata');
    }
  }, [pushToast, movements]);

  const ctx = { period, setPeriod, incomes, setIncomes, extraEntrate, setExtraEntrate, movements, setMovements, investments, setInvestments, pensione, setPensione, fido, setFido, hiddenFiles, setHiddenFiles, estrazioniBackups, setEstrazioniBackups, finanziamenti, setFinanziamenti, agenda, setAgenda, layouts, setLayouts, toasts, setToasts, pushToast, resetDashboard, marketData, refreshMarketData, isRefreshingPrices, saveProgress, lastSaved, driveClientId, setDriveClientId, driveFileInfo, driveConnected, driveStatus, gsiReady, connectDrive, disconnectDrive, forgetDriveFolder };

  let Dashboard;
  if (view === 'riepilogo') Dashboard = RiepilogoDashboard;
  else if (view === 'entrate') Dashboard = EntrateDashboard;
  else if (view === 'agenda') Dashboard = AgendaDashboard;
  else if (view === 'finanziamenti') Dashboard = FinanziamentiDashboard;
  else if (view === 'movimenti') Dashboard = MovimentiDashboard;
  else if (view === 'investimenti') Dashboard = InvestimentiDashboard;
  else Dashboard = PensioneDashboard;

  return (
    <AppCtx.Provider value={ctx}>
      <div className={"flex min-h-screen bg-neutral-50 " + (isMobile ? "flex-col" : "")}>
        {isMobile && (
          <div className="sticky top-0 z-30 h-14 bg-white border-b border-neutral-200 flex items-center px-4 gap-3 shrink-0">
            <button onClick={() => setMobileNavOpen(true)} className="text-neutral-600 hover:text-neutral-900">
              <Icons.Menu size={20} />
            </button>
            <span className="text-sm font-bold text-neutral-900 truncate">{NAV_ITEMS.find(n=>n.key===view)?.label || 'Gestione dei Flussi di Casa'}</span>
          </div>
        )}
        <Sidebar view={view} setView={setView} isMobile={isMobile} open={mobileNavOpen} onClose={() => setMobileNavOpen(false)} />
        <main className={"flex-1 min-w-0 overflow-x-auto " + (isMobile ? "px-3 py-4" : "px-6 py-6")}>
          <Dashboard />
        </main>
      </div>
      <ToastStack />
    </AppCtx.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
